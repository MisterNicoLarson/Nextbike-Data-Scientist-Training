<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>NextBike Monitoring Dashboard</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 40px;
        }

        h1{
            color: #1976d2;
        }

        table{
            border-collapse: collapse;
            width: 100%;
            background: white;
            box-shadow: 0 2px 10px rgba(0,0,0,.1);
        }

        th, td{
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th{
            background: #1976d2;
            color: white;
        }

        thead tr:nth-child(2) th{
            background: #f5f5f5;
            color: black;
        }

        thead input{
            width: 95%;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        tr:nth-child(even){
            background: #fafafa;
        }

        .CRITICAL{
            background: #ffb3b3;
        }

        .WARNING{
            background: #ffe7a1;
        }

        .MAINTENANCE{
            background: #d7d7d7;
        }

    </style>

</head>

<body>

<h1>🚲 NextBike Monitoring Dashboard</h1>

{% if alerts %}

<table id="alertsTable">

    <thead>

        <tr>
            <th>Timestamp</th>
            <th>Station</th>
            <th>City</th>
            <th>Alert Type</th>
            <th>Message</th>
        </tr>

        <tr>
            <th><input type="text" placeholder="Search timestamp"></th>
            <th><input type="text" placeholder="Search station"></th>
            <th><input type="text" placeholder="Search city"></th>
            <th><input type="text" placeholder="Search alert"></th>
            <th><input type="text" placeholder="Search message"></th>
        </tr>

    </thead>

    <tbody>

    {% for a in alerts %}

        <tr class="{{ a.alert_type }}">
            <td>{{ a.timestamp }}</td>
            <td>{{ a.name }}</td>
            <td>{{ a.city_name }}</td>
            <td>{{ a.alert_type }}</td>
            <td>{{ a.message }}</td>
        </tr>

    {% endfor %}

    </tbody>

</table>

{% else %}

<p>No alerts available.</p>

{% endif %}

<script>

document.addEventListener("DOMContentLoaded", function () {

    const table = document.getElementById("alertsTable");
    const filters = table.querySelectorAll("thead input");
    const rows = table.querySelectorAll("tbody tr");

    filters.forEach(input => {
        input.addEventListener("keyup", filterTable);
    });

    function filterTable() {

        rows.forEach(row => {

            let visible = true;

            filters.forEach((input, index) => {

                const filter = input.value.trim().toLowerCase();
                const cell = row.cells[index];

                if (filter !== "" && !cell.textContent.toLowerCase().includes(filter)) {
                    visible = false;
                }

            });

            row.style.display = visible ? "" : "none";

        });

    }

});

</script>

</body>
</html>
